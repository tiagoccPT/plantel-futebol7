<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestor de Plantel Futebol de 7</title><style>html,body{margin:0;min-height:100%;font-family:Arial;background:#08111f;color:#fff}body{display:flex;align-items:center;justify-content:center;padding:20px}main{text-align:center;background:#11213a;border:1px solid #29415f;border-radius:14px;padding:24px;width:min(520px,100%)}.s{width:42px;height:42px;margin:18px auto;border:4px solid #38506f;border-top-color:#dff4e4;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}#e{color:#ffb6b6}</style></head><body><main><h1>Gestor de Plantel Futebol de 7</h1><div class="s"></div><p id="m">A abrir a aplicação…</p><p id="e"></p></main><script>(async()=>{const replacement="  let storageUri=\"\",remoteReady=false;\n  const DB_API=\"https://api.jsonstorage.net/v1/json\";\n  const CACHE_KEY=\"f7_cache_v3\",URI_KEY=\"f7_uri_v3\";\n\n  function setSaveStatus(message,isError=false){\n    els.saveStatus.textContent=message;\n    els.saveStatus.style.color=isError?\"#ffb6b6\":\"#cfe7d4\";\n  }\n\n  function getUri(){\n    const p=new URLSearchParams(location.hash.slice(1));\n    storageUri=p.get(\"db\")||localStorage.getItem(URI_KEY)||\"\";\n    if(storageUri){\n      localStorage.setItem(URI_KEY,storageUri);\n      history.replaceState(null,\"\",location.pathname+location.search+\"#db=\"+encodeURIComponent(storageUri));\n    }\n  }\n\n  function readEmbeddedState(){\n    try{\n      const p=JSON.parse(document.getElementById(\"embedded-state\").textContent||\"{}\");\n      return{players:Array.isArray(p.players)?p.players:[],updatedAt:Number(p.updatedAt)||0};\n    }catch{return{players:[],updatedAt:0}}\n  }\n\n  function localState(){\n    try{\n      const p=JSON.parse(localStorage.getItem(CACHE_KEY)||\"{}\");\n      return{players:Array.isArray(p.players)?p.players:[],updatedAt:Number(p.updatedAt)||0};\n    }catch{return{players:[],updatedAt:0}}\n  }\n\n  function cache(){\n    localStorage.setItem(CACHE_KEY,JSON.stringify({players:state.players,updatedAt:state.updatedAt}));\n  }\n\n  function save(){\n    state.updatedAt=Date.now();\n    cache();\n    if(remoteReady){\n      clearTimeout(saveTimer);\n      setSaveStatus(\"Alterações por guardar…\");\n      saveTimer=setTimeout(()=>guardarOnline(false),700);\n    }else{\n      saveAgain=true;\n      setSaveStatus(\"Guardado neste dispositivo. A sincronizar…\");\n    }\n  }\n\n  async function ensureDb(){\n    if(storageUri)return;\n    const r=await fetch(DB_API,{\n      method:\"POST\",\n      headers:{\"Content-Type\":\"application/json\"},\n      body:JSON.stringify({players:state.players,updatedAt:state.updatedAt||Date.now()})\n    });\n    const j=await r.json();\n    if(!r.ok||!j.uri)throw new Error(\"Não foi possível criar o armazenamento online.\");\n    storageUri=j.uri;\n    localStorage.setItem(URI_KEY,storageUri);\n    history.replaceState(null,\"\",location.pathname+location.search+\"#db=\"+encodeURIComponent(storageUri));\n  }\n\n  async function syncOnline(){\n    try{\n      getUri();\n      setSaveStatus(\"A ligar ao armazenamento online…\");\n      if(!storageUri){\n        await ensureDb();\n        remoteReady=true;\n        setSaveStatus(\"Armazenamento online criado.\");\n        return;\n      }\n      const r=await fetch(storageUri,{cache:\"no-store\"});\n      if(!r.ok)throw new Error();\n      const p=await r.json();\n      const remote={players:Array.isArray(p.players)?p.players:[],updatedAt:Number(p.updatedAt)||0};\n      if(remote.updatedAt>state.updatedAt){\n        state.players=remote.players;\n        state.updatedAt=remote.updatedAt;\n        cache();\n        render();\n      }\n      remoteReady=true;\n      if(state.updatedAt>remote.updatedAt||saveAgain){\n        saveAgain=false;\n        await guardarOnline(false);\n      }else setSaveStatus(\"Plantel online sincronizado.\");\n    }catch(e){\n      console.error(e);\n      setSaveStatus(\"Sem ligação online. Ficou guardado neste dispositivo.\",true);\n    }\n  }\n\n  function load(){\n    const e=readEmbeddedState(),l=localState(),n=l.updatedAt>e.updatedAt?l:e;\n    state.players=n.players;\n    state.updatedAt=n.updatedAt;\n    syncOnline();\n  }\n\n  async function guardarOnline(manual=true){\n    clearTimeout(saveTimer);\n    if(saving){saveAgain=true;return}\n    saving=true;\n    try{\n      await ensureDb();\n      remoteReady=true;\n      if(manual){state.updatedAt=Date.now();cache()}\n      setSaveStatus(\"A guardar online…\");\n      const r=await fetch(storageUri,{\n        method:\"PUT\",\n        headers:{\"Content-Type\":\"application/json\"},\n        body:JSON.stringify({players:state.players,updatedAt:state.updatedAt})\n      });\n      if(!r.ok)throw new Error();\n      setSaveStatus(\"Guardado online às \"+new Date().toLocaleTimeString(\"pt-PT\",{hour:\"2-digit\",minute:\"2-digit\"}));\n    }catch(e){\n      console.error(e);\n      remoteReady=false;\n      setSaveStatus(\"Erro online. Ficou guardado neste dispositivo.\",true);\n      if(manual)alert(\"Não foi possível guardar online neste momento.\");\n    }finally{\n      saving=false;\n      if(saveAgain&&remoteReady){saveAgain=false;saveTimer=setTimeout(()=>guardarOnline(false),150)}\n    }\n  }\n\n  async function partilharAplicacao(){\n    try{\n      await ensureDb();\n      const url=location.href;\n      if(navigator.share){\n        try{await navigator.share({title:\"Plantel Futebol de 7\",text:\"Ligação para abrir e editar o plantel.\",url});return}\n        catch(e){if(e&&e.name===\"AbortError\")return}\n      }\n      try{await navigator.clipboard.writeText(url);setSaveStatus(\"Ligação do plantel copiada.\")}\n      catch{prompt(\"Copie esta ligação do plantel:\",url)}\n    }catch{alert(\"Não foi possível preparar a ligação de partilha.\")}\n  }\n\n  function escapeHtml(value) {";try{const r=await fetch("./index.html?v=3",{cache:"no-store"});if(!r.ok)throw Error("Não foi possível carregar a aplicação.");const s=await r.text(),x=s.match(/const DATA='([^']+)'/);if(!x)throw Error("Dados da aplicação não encontrados.");if(!window.DecompressionStream)throw Error("Atualize o navegador.");const b=atob(x[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const h=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text();const p=/  function getSiteId\(\) \{[\s\S]*?  function escapeHtml\(value\) \{/;if(!p.test(h))throw Error("Não foi possível ativar o armazenamento online.");document.open();document.write(h.replace(p,replacement));document.close()}catch(e){console.error(e);document.querySelector(".s").style.display="none";document.getElementById("m").textContent="Não foi possível abrir a aplicação.";document.getElementById("e").textContent=e.message}})();</script></body></html>
