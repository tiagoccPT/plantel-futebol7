<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestor de Plantel Futebol de 7</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial;background:#08111f;color:#fff}
body{display:flex;align-items:center;justify-content:center;padding:20px}
main{text-align:center;background:#11213a;border:1px solid #29415f;border-radius:14px;padding:24px;width:min(520px,100%)}
.s{width:42px;height:42px;margin:18px auto;border:4px solid #38506f;border-top-color:#dff4e4;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}#e{color:#ffb6b6}
</style></head>
<body><main><h1>Gestor de Plantel Futebol de 7</h1><div class="s"></div><p id="m">A abrir a aplicação…</p><p id="e"></p></main>
<script>
(async()=>{
const replacement=`  let storageUri="",remoteReady=false;
  const DB_API="https://api.jsonstorage.net/v1/json";
  const CACHE_KEY="f7_cache_v3",URI_KEY="f7_uri_v3";

  function setSaveStatus(message,isError=false){
    els.saveStatus.textContent=message;
    els.saveStatus.style.color=isError?"#ffb6b6":"#cfe7d4";
  }

  function getUri(){
    const p=new URLSearchParams(location.hash.slice(1));
    storageUri=p.get("db")||localStorage.getItem(URI_KEY)||"";
    if(storageUri){
      localStorage.setItem(URI_KEY,storageUri);
      history.replaceState(null,"",location.pathname+location.search+"#db="+encodeURIComponent(storageUri));
    }
  }

  function readEmbeddedState(){
    try{
      const p=JSON.parse(document.getElementById("embedded-state").textContent||"{}");
      return{players:Array.isArray(p.players)?p.players:[],updatedAt:Number(p.updatedAt)||0};
    }catch{return{players:[],updatedAt:0}}
  }

  function localState(){
    try{
      const p=JSON.parse(localStorage.getItem(CACHE_KEY)||"{}");
      return{players:Array.isArray(p.players)?p.players:[],updatedAt:Number(p.updatedAt)||0};
    }catch{return{players:[],updatedAt:0}}
  }

  function cache(){
    localStorage.setItem(CACHE_KEY,JSON.stringify({players:state.players,updatedAt:state.updatedAt}));
  }

  function save(){
    state.updatedAt=Date.now();
    cache();
    if(remoteReady){
      clearTimeout(saveTimer);
      setSaveStatus("Alterações por guardar…");
      saveTimer=setTimeout(()=>guardarOnline(false),700);
    }else{
      saveAgain=true;
      setSaveStatus("Guardado neste dispositivo. A sincronizar…");
    }
  }

  async function ensureDb(){
    if(storageUri)return;
    const r=await fetch(DB_API,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({players:state.players,updatedAt:state.updatedAt||Date.now()})
    });
    const j=await r.json();
    if(!r.ok||!j.uri)throw new Error("Não foi possível criar o armazenamento online.");
    storageUri=j.uri;
    localStorage.setItem(URI_KEY,storageUri);
    history.replaceState(null,"",location.pathname+location.search+"#db="+encodeURIComponent(storageUri));
  }

  async function syncOnline(){
    try{
      getUri();
      setSaveStatus("A ligar ao armazenamento online…");
      if(!storageUri){
        await ensureDb();
        remoteReady=true;
        setSaveStatus("Armazenamento online criado.");
        return;
      }
      const r=await fetch(storageUri,{cache:"no-store"});
      if(!r.ok)throw new Error();
      const p=await r.json();
      const remote={players:Array.isArray(p.players)?p.players:[],updatedAt:Number(p.updatedAt)||0};
      if(remote.updatedAt>state.updatedAt){
        state.players=remote.players;
        state.updatedAt=remote.updatedAt;
        cache();
        render();
      }
      remoteReady=true;
      if(state.updatedAt>remote.updatedAt||saveAgain){
        saveAgain=false;
        await guardarOnline(false);
      }else setSaveStatus("Plantel online sincronizado.");
    }catch(e){
      console.error(e);
      setSaveStatus("Sem ligação online. Ficou guardado neste dispositivo.",true);
    }
  }

  function load(){
    const e=readEmbeddedState(),l=localState(),n=l.updatedAt>e.updatedAt?l:e;
    state.players=n.players;
    state.updatedAt=n.updatedAt;
    syncOnline();
  }

  async function guardarOnline(manual=true){
    clearTimeout(saveTimer);
    if(saving){saveAgain=true;return}
    saving=true;
    try{
      await ensureDb();
      remoteReady=true;
      if(manual){state.updatedAt=Date.now();cache()}
      setSaveStatus("A guardar online…");
      const r=await fetch(storageUri,{
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({players:state.players,updatedAt:state.updatedAt})
      });
      if(!r.ok)throw new Error();
      setSaveStatus("Guardado online às "+new Date().toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}));
    }catch(e){
      console.error(e);
      remoteReady=false;
      setSaveStatus("Erro online. Ficou guardado neste dispositivo.",true);
      if(manual)alert("Não foi possível guardar online neste momento.");
    }finally{
      saving=false;
      if(saveAgain&&remoteReady){saveAgain=false;saveTimer=setTimeout(()=>guardarOnline(false),150)}
    }
  }

  async function partilharAplicacao(){
    try{
      await ensureDb();
      const url=location.href;
      if(navigator.share){
        try{await navigator.share({title:"Plantel Futebol de 7",text:"Ligação para abrir e editar o plantel.",url});return}
        catch(e){if(e&&e.name==="AbortError")return}
      }
      try{await navigator.clipboard.writeText(url);setSaveStatus("Ligação do plantel copiada.")}
      catch{prompt("Copie esta ligação do plantel:",url)}
    }catch{alert("Não foi possível preparar a ligação de partilha.")}
  }

  function escapeHtml(value) {`;

try{
  const r=await fetch("https://raw.githubusercontent.com/tiagoccPT/plantel-futebol7/main/index.html?"+Date.now(),{cache:"no-store"});
  if(!r.ok)throw Error("Não foi possível carregar a aplicação.");
  const s=await r.text(),x=s.match(/const DATA='([^']+)'/);
  if(!x)throw Error("Dados da aplicação não encontrados.");
  if(!window.DecompressionStream)throw Error("Atualize o navegador.");
  const b=atob(x[1]),u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  const h=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  const p=/  function getSiteId\(\) \{[\s\S]*?  function escapeHtml\(value\) \{/;
  if(!p.test(h))throw Error("Não foi possível ativar o armazenamento online.");
  document.open();document.write(h.replace(p,replacement));document.close();
}catch(e){
  console.error(e);
  document.querySelector(".s").style.display="none";
  document.getElementById("m").textContent="Não foi possível abrir a aplicação.";
  document.getElementById("e").textContent=e.message;
}
})();
</script></body></html>
