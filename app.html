<!DOCTYPE html>
<html lang="pt">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestor de Plantel Futebol de 7</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#08111f;color:#fff;font-family:Arial,sans-serif}
.box{max-width:520px;margin:20px;padding:24px;border:1px solid #29415f;border-radius:14px;background:#11213a;text-align:center}
.spinner{width:40px;height:40px;margin:18px auto;border:4px solid #38506f;border-top-color:#dff4e4;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body>
<div class="box"><h2>A abrir o Gestor de Plantel…</h2><div class="spinner"></div><p id="msg">A preparar a aplicação.</p></div>
<script>
(async()=>{
const msg=document.getElementById("msg");
try{
  const src=await fetch("https://raw.githubusercontent.com/tiagoccPT/plantel-futebol7/main/index.html?"+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("Fonte indisponível");return r.text()});
  const m=src.match(/const DATA='([^']+)'/);
  if(!m)throw new Error("Dados da aplicação não encontrados");
  const bin=atob(m[1]),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();

  html=html.replace(
    '  const JSON_BLOB_ID = "__JSONBLOB_ID__";\n  const JSON_BLOB_URL = "https://jsonblob.com/api/jsonBlob/" + JSON_BLOB_ID;\n',
    '  const LOCAL_STATE_KEY = "f7_plantel_state_v2";\n  const BLOB_ID_KEY = "f7_plantel_blob_id_v2";\n  let JSON_BLOB_ID = new URLSearchParams(location.hash.replace(/^#/, "")).get("blob") || localStorage.getItem(BLOB_ID_KEY) || "";\n  let JSON_BLOB_URL = JSON_BLOB_ID ? "https://jsonblob.com/api/jsonBlob/" + JSON_BLOB_ID : "";\n'
  );

  const start=html.indexOf("  function save() {");
  const end=html.indexOf("  async function shareApp()");
  if(start<0||end<0)throw new Error("Versão da aplicação não reconhecida");
  const backend=`  function snapshot(){return{players:state.players,updatedAt:state.updatedAt}}
  function saveLocal(){try{localStorage.setItem(LOCAL_STATE_KEY,JSON.stringify(snapshot()))}catch(e){console.warn(e)}}
  function updateShareUrl(){if(!JSON_BLOB_ID)return;localStorage.setItem(BLOB_ID_KEY,JSON_BLOB_ID);const p=new URLSearchParams();p.set("blob",JSON_BLOB_ID);history.replaceState(null,"",location.pathname+location.search+"#"+p.toString())}
  async function ensureOnlineBlob(){if(JSON_BLOB_URL)return JSON_BLOB_URL;const r=await fetch("https://jsonblob.com/api/jsonBlob",{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(snapshot())});if(!r.ok)throw new Error("Falha ao criar armazenamento");const loc=r.headers.get("Location")||r.headers.get("location"),hid=r.headers.get("X-jsonblob")||r.headers.get("x-jsonblob"),did=loc?loc.split("/").filter(Boolean).pop():"";JSON_BLOB_ID=hid||did;if(!JSON_BLOB_ID)throw new Error("Sem identificador");JSON_BLOB_URL="https://jsonblob.com/api/jsonBlob/"+JSON_BLOB_ID;updateShareUrl();return JSON_BLOB_URL}
  function save(){state.updatedAt=Date.now();saveLocal();clearTimeout(saveTimer);setSaveStatus("Alterações por guardar…");saveTimer=setTimeout(()=>saveOnline(false),850)}
  async function load(){setSaveStatus("A carregar o plantel…");try{const l=JSON.parse(localStorage.getItem(LOCAL_STATE_KEY)||"null");if(l&&Array.isArray(l.players)){state.players=l.players;state.updatedAt=Number(l.updatedAt)||0}}catch(e){console.warn(e)}
    if(!JSON_BLOB_ID){try{await ensureOnlineBlob();setSaveStatus("Plantel online pronto.")}catch(e){console.warn(e);setSaveStatus("Modo local ativo. A app continua funcional.",true)}saveLocal();return}
    JSON_BLOB_URL="https://jsonblob.com/api/jsonBlob/"+JSON_BLOB_ID;updateShareUrl();
    try{const r=await fetch(JSON_BLOB_URL,{method:"GET",headers:{"Accept":"application/json"},cache:"no-store"});if(!r.ok)throw new Error("Falha ao carregar");const d=await r.json();if(Array.isArray(d.players)){state.players=d.players;state.updatedAt=Number(d.updatedAt)||0;saveLocal()}setSaveStatus("Plantel online carregado.")}catch(e){console.warn(e);setSaveStatus("Sem ligação online. A usar a cópia local.",true)}
  }
  async function saveOnline(manual=true){if(saving){saveAgain=true;return}clearTimeout(saveTimer);saving=true;state.updatedAt=Date.now();saveLocal();setSaveStatus("A guardar online…");
    try{await ensureOnlineBlob();const r=await fetch(JSON_BLOB_URL,{method:"PUT",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(snapshot())});if(!r.ok)throw new Error("Falha ao guardar");const t=new Date().toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit",second:"2-digit"});setSaveStatus("Guardado online às "+t)}
    catch(e){console.warn(e);setSaveStatus("Guardado neste dispositivo. Online indisponível.",true);if(manual)alert("A aplicação ficou guardada neste dispositivo. A sincronização online não está disponível neste momento.")}
    finally{saving=false;if(saveAgain){saveAgain=false;saveTimer=setTimeout(()=>saveOnline(false),150)}}
  }

`;
  html=html.slice(0,start)+backend+html.slice(end);

  const ss=html.indexOf("  async function shareApp()");
  const se=html.indexOf("  function ",ss+10);
  if(ss<0||se<0)throw new Error("Partilha não reconhecida");
  const share=`  async function shareApp(){try{await ensureOnlineBlob()}catch(e){console.warn(e)}const url=location.href;try{if(navigator.share){await navigator.share({title:"Plantel Futebol de 7",text:"Plantel editável de futebol de 7.",url});return}}catch(e){if(e&&e.name==="AbortError")return}try{await navigator.clipboard.writeText(url);setSaveStatus("Ligação copiada.")}catch(e){prompt("Copie esta ligação:",url)}}

`;
  html=html.slice(0,ss)+share+html.slice(se);
  html=html.replace("As alterações são guardadas online no mesmo plantel. Toque ou clique num","As alterações são guardadas automaticamente. Use <b>Partilhar</b> para abrir o mesmo plantel noutro dispositivo. Toque ou clique num");

  document.open();document.write(html);document.close();
}catch(e){
  console.error(e);msg.textContent="Não foi possível abrir a aplicação. Atualize a página.";
  document.querySelector(".spinner").style.display="none";
}
})();
</script></body></html>
