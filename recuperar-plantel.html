<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar Plantel Futebol 7</title>
<style>
body{font-family:Arial,sans-serif;background:#08111f;color:#fff;margin:0;padding:20px}main{max-width:760px;margin:auto;background:#11213a;border:1px solid #314766;border-radius:12px;padding:18px}button{padding:10px 14px;margin:6px 6px 6px 0;border:0;border-radius:7px;font-weight:700;cursor:pointer}textarea{width:100%;min-height:300px;margin-top:12px;padding:10px;box-sizing:border-box}#status{margin:12px 0;color:#cfe7d4}.warn{color:#ffd27a}</style>
</head>
<body>
<main>
<h1>Recuperar plantel</h1>
<p>Esta página lê apenas a cópia guardada neste dispositivo. Não altera nem apaga o plantel.</p>
<div id="status">A procurar a cópia local…</div>
<button id="copiar" type="button">Copiar backup</button>
<button id="descarregar" type="button">Descarregar backup</button>
<textarea id="dados" readonly></textarea>
</main>
<script>
(() => {
  const DB_ID = '019fb865-7007-7bb3-9f93-68f50bf7daa6';
  const keys = [
    'f7_jsonblob_' + DB_ID,
    'f7_jsonblob_draft',
    'f7_cache_v3',
    'plantel_futebol7_completo_v10'
  ];
  const status = document.getElementById('status');
  const dados = document.getElementById('dados');
  let foundKey = '';
  let raw = '';
  for (const key of keys) {
    try {
      const value = localStorage.getItem(key);
      if (value) { foundKey = key; raw = value; break; }
    } catch (_) {}
  }
  if (raw) {
    try { dados.value = JSON.stringify(JSON.parse(raw), null, 2); }
    catch (_) { dados.value = raw; }
    status.textContent = 'Backup encontrado neste dispositivo (' + foundKey + ').';
  } else {
    status.textContent = 'Não encontrei uma cópia local neste navegador. Abra esta página no mesmo navegador onde o plantel ainda aparece.';
    status.className = 'warn';
  }
  document.getElementById('copiar').addEventListener('click', async () => {
    if (!dados.value) return;
    try {
      await navigator.clipboard.writeText(dados.value);
      status.textContent = 'Backup copiado. Guarde-o num local seguro.';
    } catch (_) {
      dados.focus(); dados.select();
      status.textContent = 'Selecione e copie manualmente o conteúdo abaixo.';
    }
  });
  document.getElementById('descarregar').addEventListener('click', () => {
    if (!dados.value) return;
    const blob = new Blob([dados.value], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'backup-plantel-futebol7-' + DB_ID + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    status.textContent = 'Backup descarregado.';
  });
})();
</script>
</body>
</html>
