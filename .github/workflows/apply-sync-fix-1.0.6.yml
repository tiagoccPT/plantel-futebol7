name: Apply sync fix 1.0.6

on:
  push:
    branches: [main]
    paths:
      - 'sync-fix-1.0.6-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply synchronization fix
        run: python tools/fix_sync_1_0_6.py
      - name: Verify patch
        run: |
          grep -q "Timer.periodic(const Duration(seconds: 5)" flutter_app/lib/main.dart
          grep -q "Atualizado de outro dispositivo" flutter_app/lib/main.dart
          grep -q "final remote = await _storage.loadRemote();" flutter_app/lib/main.dart
          grep -q "version: 1.0.6+7" flutter_app/pubspec.yaml
      - name: Commit synchronization fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib/main.dart flutter_app/pubspec.yaml
          git commit -m "Corrigir sincronização entre dispositivos" || exit 0
          git push origin main
