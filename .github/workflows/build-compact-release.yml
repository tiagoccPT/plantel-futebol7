name: Build compact Android and Windows release

on:
  pull_request:
    branches: [main]
    paths:
      - release-build-trigger.txt

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        working-directory: flutter_app
        run: flutter create --platforms=android --project-name plantel_futebol7 .
      - name: Dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze
      - name: Test
        working-directory: flutter_app
        run: flutter test
      - name: Build Android APK
        working-directory: flutter_app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Plantel_Futebol7_Android_1.0.1
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows platform files
        working-directory: flutter_app
        run: flutter create --platforms=windows --project-name plantel_futebol7 .
      - name: Dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze
      - name: Test
        working-directory: flutter_app
        run: flutter test
      - name: Build Windows
        working-directory: flutter_app
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: Plantel_Futebol7_Windows_1.0.1
          path: flutter_app/build/windows/x64/runner/Release/**
          if-no-files-found: error
