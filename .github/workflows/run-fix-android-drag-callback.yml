name: Fix Android drag callback

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_android_drag_callback.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 tools/fix_android_drag_callback.py
      - run: grep -q 'onEnd = (_) {' flutter_app/lib/field_widget.dart
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib/field_widget.dart
          git commit -m "Fix Android drag gesture callbacks" || exit 0
          git push origin HEAD:main
