name: Fix player list dragging

on:
  pull_request_target:
    branches: [main]
    paths:
      - fix-list-drag-trigger.txt

permissions:
  contents: write
  pull-requests: read

jobs:
  update-application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply robust drag fix
        run: python3 tools/fix_list_drag.py

      - name: Verify drag fix
        run: |
          grep -q 'LIST_DRAG_FIX_V2' plantel-online.html
          grep -q 'document.addEventListener("pointermove", onMove' plantel-online.html
          grep -q 'function commitPlayerOrderFromTable()' plantel-online.html
          grep -q '"AV": "PL"' plantel-online.html

      - name: Commit updated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plantel-online.html
          git commit -m "Fix player list dragging" || exit 0
          git push origin HEAD:main
