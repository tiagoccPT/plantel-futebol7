name: Silence sync pending status

on:
  pull_request_target:
    branches: [main]
    paths:
      - silent-sync-trigger.txt

permissions:
  contents: write
  pull-requests: read

jobs:
  update-application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply silent sync status patch
        run: python3 tools/silence_sync_status.py

      - name: Verify patch
        run: |
          grep -q 'SILENT_SYNC_STATUS_V1' plantel-online.html
          grep -q 'setSaveStatus("Guardado", false)' plantel-online.html
          grep -q 'function scheduleRetry' plantel-online.html

      - name: Commit updated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plantel-online.html
          git commit -m "Keep online retries silent in the interface" || exit 0
          git push origin HEAD:main
