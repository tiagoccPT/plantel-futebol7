name: Add AV and draggable player list

on:
  push:
    branches: [main]
    paths:
      - av-list-drag-trigger.txt
  pull_request_target:
    branches: [main]
    paths:
      - av-list-drag-trigger.txt

permissions:
  contents: write
  pull-requests: read

jobs:
  update-application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply AV recognition and list dragging
        run: python3 tools/apply_av_and_list_drag.py

      - name: Verify existing application remains intact
        run: |
          grep -q 'const JSON_BLOB_API = "https://jsonblob.com/api/jsonBlob"' plantel-online.html
          grep -q 'function togglePlantel()' plantel-online.html
          grep -q 'INLINE_EDIT_V1' plantel-online.html
          grep -q 'PLANTEL_LAYOUT_MEMORY_V1' plantel-online.html
          grep -q 'LIST_DRAG_AV_V1' plantel-online.html
          grep -q '"AV": "PL"' plantel-online.html
          grep -q 'data-action="drag"' plantel-online.html
          grep -q 'function enablePlayerRowDrag(row)' plantel-online.html

      - name: Commit updated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plantel-online.html
          git commit -m "Recognize AV and allow player list reordering" || exit 0
          git push origin HEAD:main
