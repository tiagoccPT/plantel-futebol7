name: Improve Android drag interaction

on:
  push:
    branches: [main]
    paths:
      - 'tools/improve_android_drag.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply drag interaction improvements
        run: python3 tools/improve_android_drag.py
      - name: Verify patch
        run: |
          grep -q 'ANDROID_DRAG_PRIORITY_V1' flutter_app/lib/main.dart
          grep -q '_ImmediateDragGestureRecognizer' flutter_app/lib/field_widget.dart
          grep -q 'onInteractionStart' flutter_app/lib/field_widget.dart
      - name: Commit application update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib/main.dart flutter_app/lib/field_widget.dart
          git commit -m "Improve Android drag priority over page scrolling" || exit 0
          git push origin HEAD:main
