name: Validate design tactics

on:
  push:
    branches:
      - design-taticas-suplentes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: design-taticas-suplentes

      - name: Restore updated main.dart
        shell: bash
        run: |
          base64 --decode tools/main_v2.dart.gz.b64 | gzip --decompress > flutter_app/lib/main.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Format
        working-directory: flutter_app
        run: dart format lib/main.dart lib/models.dart

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: Test
        working-directory: flutter_app
        run: flutter test

      - name: Commit validated interface
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib/main.dart flutter_app/lib/models.dart
          if ! git diff --cached --quiet; then
            git commit -m "Add premium tactics and substitutes interface"
            git push origin HEAD:design-taticas-suplentes
          fi
