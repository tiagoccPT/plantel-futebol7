name: Deploy Football 7 App

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract app and deploy
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re, base64, gzip
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r"const DATA='([^']+)'", text)
          if not match:
              raise SystemExit("Compressed app payload not found in index.html")

          app = gzip.decompress(base64.b64decode(match.group(1)))
          Path("app-template.html").write_bytes(app)
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path

          html = Path("app-template.html").read_text(encoding="utf-8")
          payload = {
              "html": html,
              "title": "Gestor de Plantel Futebol de 7",
              "ogTitle": "Gestor de Plantel Futebol de 7",
              "ogDescription": "Aplicação online editável para gerir um plantel de futebol de 7."
          }
          Path("payload.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8"
          )
          PY

          curl --fail-with-body --silent --show-error \
            -X POST "https://freekit.dev/api/v1/sites" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            > response.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("response.json").read_text(encoding="utf-8"))
          if result.get("status") != "success":
              raise SystemExit(result)

          data = result["data"]
          compact = (
              data["siteId"] + "|" +
              data["url"] + "|" +
              data["deleteToken"]
          )
          Path("deployment-plain.txt").write_text(compact, encoding="utf-8")
          PY

          cat > public.pem <<'KEY'
-----BEGIN PUBLIC KEY-----
MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAzfTGkM55TNcLRvQdVt7u
hAmbcxG7ruf9fgnCtmA2EDhSl3pG0A/UayreWlR8LWTlFJLZ8w8PkOJ/AJxnD6pk
uQF4wtjeY9WpWmjVbljzL1OFQNOr9upAc77/r3BHZurZX0VQgyAEXH/0rWEQdZKb
s+sBavSZgHgbyIMZZ6QLaAnk+KeQgADGLoXKbgfed9Q77Ji30AI/P/4ra34z4lpA
dQNaINY9zM83S3rHoySJcDlTBN6uqArUxWIlO88GAWi4AX66PnFIpRb4n2nhVtv1
3n5Z++zNeV2xYOv7LokgksPhrv4nvg2N8xgCDU7GgYgvdRmcYEVrhcDlfacE5Awh
kK7+iBOSH/RuEAWB1xraZtdXqjfMwM2mZa9xcgXrrEwgYH7ZTFZAPsEWeL+2EQOh
Kq72Zo/mrK3SwpAP7LnCO4vJW/qIlm2uYFFte9jga4iV+8v+b16ydQhUHtXbKa9w
1N5KHUCDOkmEn9MDrJdmKoSrSPLx886d+gSWG9FUGVbpnIaF1L5gztOAlwxhZ9ac
EqwEC6l1qW0p5blF3XBajiAwGVFfFHpiTBDKpyTCcwM7aYrWyBJvBeZaJgd0yWjE
0llKXIuIEmbXgzICq5/4mbW4AN+JIU7qNOvL7nINRljqjBPmHbnTuFaoR4pKi5gk
JwR87Nbb+bJZiXPx8g5TNXMCAwEAAQ==
-----END PUBLIC KEY-----
KEY

          openssl pkeyutl -encrypt \
            -pubin -inkey public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in deployment-plain.txt \
            -out deployment.bin

          base64 -w 0 deployment.bin > deployment.enc

      - name: Upload encrypted deployment result
        uses: actions/upload-artifact@v4
        with:
          name: deployment-result
          path: deployment.enc
          retention-days: 1
