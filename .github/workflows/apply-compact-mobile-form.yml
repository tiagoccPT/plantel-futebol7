name: Apply compact mobile form

on:
  push:
    branches: [main]
    paths:
      - 'compact-mobile-form-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply compact mobile form
        run: python tools/compact_mobile_form.py
      - name: Verify changes
        run: |
          grep -q 'mobilePanelHeight' flutter_app/lib/main.dart
          grep -q 'height: compact ? 38 : 42' flutter_app/lib/main.dart
          grep -q 'version: 1.0.4+5' flutter_app/pubspec.yaml
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib/main.dart flutter_app/pubspec.yaml
          git commit -m "Compactar formulário e painel do plantel no mobile"
          git push origin main
