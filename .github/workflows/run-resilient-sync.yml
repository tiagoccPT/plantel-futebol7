name: Apply resilient online sync

on:
  push:
    branches: [main]
    paths:
      - tools/fix_resilient_sync.py

permissions:
  contents: write

jobs:
  update-application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply resilient sync patch
        run: python3 tools/fix_resilient_sync.py

      - name: Verify patch
        run: |
          grep -q 'RESILIENT_SYNC_V1' plantel-online.html
          grep -q 'function scheduleRetry' plantel-online.html
          grep -q 'window.addEventListener("online"' plantel-online.html
          grep -q 'LIST_DRAG_FIX_V2' plantel-online.html
          grep -q '"AV": "PL"' plantel-online.html

      - name: Commit updated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plantel-online.html
          git commit -m "Make online sync resilient with automatic retry" || exit 0
          git push origin HEAD:main
