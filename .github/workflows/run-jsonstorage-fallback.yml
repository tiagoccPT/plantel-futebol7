name: Migrate failing JSONBlob storage

on:
  pull_request_target:
    branches: [main]
    paths:
      - jsonstorage-fallback-trigger.txt

permissions:
  contents: write
  pull-requests: read

jobs:
  update-application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply JSONStorage fallback migration
        run: python3 tools/migrate_jsonblob_to_jsonstorage.py

      - name: Verify application
        run: |
          grep -q 'JSONSTORAGE_FALLBACK_V1' plantel-online.html
          grep -q 'https://api.jsonstorage.net/v1/json' plantel-online.html
          grep -q 'async function createFallbackStorage()' plantel-online.html
          grep -q 'async function putFallbackStorage()' plantel-online.html
          grep -q 'LIST_DRAG_FIX_V2' plantel-online.html
          grep -q '"AV": "PL"' plantel-online.html

      - name: Commit updated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plantel-online.html
          git commit -m "Migrate failed JSONBlob sync to JSONStorage fallback" || exit 0
          git push origin HEAD:main
