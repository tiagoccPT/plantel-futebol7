name: Build Flutter Android and Windows

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter-app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/build-flutter-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Regenerate modern Android platform
        working-directory: flutter_app
        run: |
          rm -rf android
          flutter create --platforms=android --project-name plantel_futebol7 --org com.example .
          python3 - <<'PY'
from pathlib import Path
p = Path('android/app/src/main/AndroidManifest.xml')
s = p.read_text()
if 'android.permission.INTERNET' not in s:
    s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />')
s = s.replace('android:label="plantel_futebol7"', 'android:label="Plantel Futebol 7"')
p.write_text(s)
PY
      - name: Dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze
      - name: Test
        working-directory: flutter_app
        run: flutter test
      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: plantel-futebol7-android
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows platform files
        working-directory: flutter_app
        run: flutter create --platforms=windows --project-name plantel_futebol7 .
      - name: Dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze
      - name: Test
        working-directory: flutter_app
        run: flutter test
      - name: Build Windows
        working-directory: flutter_app
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: plantel-futebol7-windows
          path: flutter_app/build/windows/x64/runner/Release/**
          if-no-files-found: error
