name: Run actions-only update

on:
  pull_request_target:
    branches: [main]
    paths:
      - actions-update-trigger.txt

permissions:
  contents: write
  pull-requests: read

jobs:
  update-actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply only the requested action changes
        run: python3 tools/apply_actions_only.py

      - name: Verify storage and opening code stayed in place
        run: |
          grep -q 'const JSON_BLOB_API = "https://jsonblob.com/api/jsonBlob"' plantel-online.html
          grep -q 'data-role="inicial"' plantel-online.html
          grep -q 'data-role="suplente"' plantel-online.html
          grep -q 'data-role="reserva"' plantel-online.html
          grep -q 'id="plantel"' plantel-online.html
          grep -q 'function togglePlantel()' plantel-online.html

      - name: Commit the modified application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plantel-online.html
          git commit -m "Modify only the player actions" || exit 0
          git push origin HEAD:main
