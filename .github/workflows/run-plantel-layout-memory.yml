name: Remember Plantel layout

on:
  pull_request_target:
    branches: [main]
    paths:
      - plantel-layout-trigger.txt

permissions:
  contents: write
  pull-requests: read

jobs:
  update-application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add persistent Plantel layout memory
        run: python3 tools/apply_plantel_layout_memory.py

      - name: Verify existing application remained intact
        run: |
          grep -q 'const JSON_BLOB_API = "https://jsonblob.com/api/jsonBlob"' plantel-online.html
          grep -q 'function togglePlantel()' plantel-online.html
          grep -q 'INLINE_EDIT_V1' plantel-online.html
          grep -q 'PLANTEL_LAYOUT_MEMORY_V1' plantel-online.html
          grep -q 'function rememberPlantelLayout()' plantel-online.html
          grep -q 'player.cards = buildRememberedPlantelCards(player);' plantel-online.html

      - name: Commit updated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plantel-online.html
          git commit -m "Remember Plantel card positions" || exit 0
          git push origin HEAD:main
