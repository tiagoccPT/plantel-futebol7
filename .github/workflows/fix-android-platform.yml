name: Fix Android platform detection

on:
  push:
    branches: [main]
    paths:
      - 'android-platform-fix-trigger.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply platform detection fix
        run: python tools/fix_android_platform_detection.py
      - name: Verify
        run: |
          grep -q 'Theme.of(context).platform == TargetPlatform.android' flutter_app/lib/main.dart
          grep -q 'version: 1.0.5+6' flutter_app/pubspec.yaml
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib/main.dart
          git commit -m "Corrigir deteção de plataforma Android" || exit 0
          git push origin main
