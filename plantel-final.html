<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestor de Plantel Futebol de 7</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#08111f;color:#fff}
body{display:flex;align-items:center;justify-content:center;padding:20px}
main{text-align:center;background:#11213a;border:1px solid #29415f;border-radius:14px;padding:24px;width:min(520px,100%)}
.s{width:42px;height:42px;margin:18px auto;border:4px solid #38506f;border-top-color:#dff4e4;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#e{color:#ffb6b6;white-space:pre-line}
</style>
</head>
<body>
<main>
<h1>Gestor de Plantel Futebol de 7</h1>
<div class="s"></div>
<p id="m">A abrir a aplicação…</p>
<p id="e"></p>
</main>
<script>
(async()=>{
  const nativeFetch=window.fetch.bind(window);
  const GH_OWNER="tiagoccPT";
  const GH_REPO="plantel-futebol7";
  const GH_BRANCH="main";
  const GH_PATH="plantel-data.json";
  const GH_API="https://api.github.com/repos/"+GH_OWNER+"/"+GH_REPO+"/contents/"+GH_PATH;
  const TOKEN_KEY="f7_github_write_token";
  let currentSha="";

  function headers(token=""){
    const value={
      "Accept":"application/vnd.github+json",
      "X-GitHub-Api-Version":"2022-11-28"
    };
    if(token)value.Authorization="Bearer "+token;
    return value;
  }

  function decode(value){
    const binary=atob(String(value||"").replace(/\s/g,""));
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }

  function encode(value){
    const bytes=new TextEncoder().encode(value);
    let binary="";
    for(let index=0;index<bytes.length;index+=32768){
      binary+=String.fromCharCode(...bytes.subarray(index,index+32768));
    }
    return btoa(binary);
  }

  async function readData(){
    const token=localStorage.getItem(TOKEN_KEY)||"";
    const response=await nativeFetch(
      GH_API+"?ref="+encodeURIComponent(GH_BRANCH)+"&t="+Date.now(),
      {headers:headers(token),cache:"no-store"}
    );
    if(response.status===404){
      currentSha="";
      return {players:[],updatedAt:0};
    }
    if(!response.ok){
      const result=await response.json().catch(()=>({}));
      throw new Error(result.message||"Não foi possível ler o plantel online.");
    }
    const result=await response.json();
    currentSha=result.sha||"";
    return JSON.parse(decode(result.content||"e30="));
  }

  function requestToken(){
    let token=localStorage.getItem(TOKEN_KEY)||"";
    if(token)return token;
    token=prompt(
      "Para guardar online pela primeira vez, cole o token GitHub do repositório plantel-futebol7.\n\n"+
      "Permissão necessária: Contents — Read and write.\n\n"+
      "O token fica apenas neste navegador e não é enviado na ligação partilhada."
    )||"";
    token=token.trim();
    if(!token)throw new Error("Gravação online não ativada.");
    localStorage.setItem(TOKEN_KEY,token);
    return token;
  }

  async function writeData(data){
    const token=requestToken();
    await readData();
    const body={
      message:"Atualizar plantel de futebol de 7",
      content:encode(JSON.stringify(data,null,2)),
      branch:GH_BRANCH
    };
    if(currentSha)body.sha=currentSha;
    const response=await nativeFetch(GH_API,{
      method:"PUT",
      headers:{...headers(token),"Content-Type":"application/json"},
      body:JSON.stringify(body)
    });
    const result=await response.json().catch(()=>({}));
    if(!response.ok){
      if(response.status===401||response.status===403){
        localStorage.removeItem(TOKEN_KEY);
      }
      throw new Error(result.message||"Não foi possível guardar no GitHub.");
    }
    currentSha=result.content&&result.content.sha?result.content.sha:currentSha;
    return data;
  }

  function apiResponse(data,status=200,extra={}){
    return new Response(JSON.stringify(data),{
      status,
      headers:{
        "Content-Type":"application/json",
        "Location":"https://jsonblob.com/api/jsonBlob/github",
        "X-jsonblob":"github",
        ...extra
      }
    });
  }

  window.fetch=async function(input,init={}){
    const url=typeof input==="string"?input:input.url;
    if(!url.startsWith("https://jsonblob.com/api/jsonBlob")){
      return nativeFetch(input,init);
    }
    const method=String(init.method||"GET").toUpperCase();
    if(method==="GET"){
      return apiResponse(await readData(),200);
    }
    if(method==="POST"){
      const data=JSON.parse(init.body||"{}");
      await writeData(data);
      return apiResponse(data,201);
    }
    if(method==="PUT"){
      const data=JSON.parse(init.body||"{}");
      await writeData(data);
      return apiResponse(data,200);
    }
    throw new Error("Operação não suportada.");
  };

  function migrateLocalData(){
    const destination="f7_jsonblob_github";
    if(localStorage.getItem(destination))return;
    let best=null;
    for(let index=0;index<localStorage.length;index++){
      const key=localStorage.key(index)||"";
      if(!key.startsWith("f7_jsonblob_")||key===destination)continue;
      try{
        const value=JSON.parse(localStorage.getItem(key)||"{}");
        if(Array.isArray(value.players)&&(!best||Number(value.updatedAt||0)>Number(best.updatedAt||0))){
          best=value;
        }
      }catch{}
    }
    if(!best){
      for(const key of ["f7_cache_v3","plantel_futebol7_completo_v10"]){
        try{
          const value=JSON.parse(localStorage.getItem(key)||"{}");
          if(Array.isArray(value.players)){best=value;break}
        }catch{}
      }
    }
    if(best)localStorage.setItem(destination,JSON.stringify(best));
  }

  try{
    migrateLocalData();
    const params=new URLSearchParams(location.hash.slice(1));
    if(!params.get("db")){
      params.set("db","github");
      history.replaceState(null,"",location.pathname+location.search+"#"+params.toString());
    }
    const response=await nativeFetch("./plantel-v2.html?v=4",{cache:"no-store"});
    if(!response.ok)throw new Error("Não foi possível carregar a aplicação.");
    const source=await response.text();
    document.open();
    document.write(source);
    document.close();
  }catch(error){
    console.error(error);
    document.querySelector(".s").style.display="none";
    document.getElementById("m").textContent="Não foi possível abrir a aplicação.";
    document.getElementById("e").textContent=error.message;
  }
})();
</script>
</body>
</html>
